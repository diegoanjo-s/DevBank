# Esteira de integração contínua (CI)
# A cada push e a cada pull request, o GitHub compila o projeto e roda todos os testes.
# Se algum teste falhar, o commit/PR fica marcado com ❌.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Compilar e testar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # reaproveita as dependências entre execuções

      - name: Rodar os testes
        run: ./mvnw -B verify

      - name: Guardar o relatório dos testes
        if: always() # guarda mesmo se falhar, para ver o motivo
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/
