spring.application.name=devbank

# Banco de dados H2 (em memória)
spring.datasource.url=jdbc:h2:mem:devbank
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 (apenas para desenvolvimento)
spring.h2.console.enabled=true

# Mostrar no log o SQL que o Hibernate gera
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nunca expor o stack trace nas respostas de erro
server.error.include-stacktrace=never

# Saldo com que toda conta nova nasce (bônus de teste do DevBank)
devbank.saldo-inicial=300.00

# Rodar o data.sql só DEPOIS que o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true