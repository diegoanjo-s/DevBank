spring.application.name=devbank

# Se nenhum profile for informado, usa o de desenvolvimento
spring.profiles.default=dev

# Nunca expor o stack trace nas respostas de erro
spring.web.error.include-stacktrace=never

# Sites que podem chamar a API pelo navegador. Em produção vem do ambiente
devbank.cors.origens=${CORS_ORIGENS:http://localhost:5173}
