# Banco de dados H2 (em memória)
spring.datasource.url=jdbc:h2:mem:devbank
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2
spring.h2.console.enabled=true

# Mostrar no log o SQL que o Hibernate gera
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Rodar o data.sql só DEPOIS que o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true

# Banco fictício: toda conta nova nasce com saldo simulado
devbank.saldo-inicial=300.00

# O Flyway só roda em produção
spring.flyway.enabled=false

# Chave que assina os tokens. Serve SOMENTE para desenvolvimento
devbank.jwt.segredo=chave-de-desenvolvimento-nao-use-em-producao-123456
devbank.jwt.expiracao-minutos=60