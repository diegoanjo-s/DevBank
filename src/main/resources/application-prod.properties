# Banco de dados: os valores vêm de variáveis de ambiente, nunca do código
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Nunca rodar o data.sql em produção
spring.sql.init.mode=never

# Banco fictício: toda conta nova nasce com saldo simulado, para demonstração
devbank.saldo-inicial=300.00

# Quem cria as tabelas é o Flyway. O Hibernate só confere se batem com as entities
spring.jpa.hibernate.ddl-auto=validate

# Chave que assina os tokens: vem do ambiente, nunca do código
devbank.jwt.segredo=${JWT_SECRET}
devbank.jwt.expiracao-minutos=60