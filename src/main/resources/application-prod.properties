# Banco de dados: os valores vêm de variáveis de ambiente, nunca do código
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Nunca rodar o data.sql em produção
spring.sql.init.mode=never

# Banco fictício: toda conta nova nasce com saldo simulado, para demonstração
devbank.saldo-inicial=300.00


# Temporário: o Hibernate cria as tabelas. A Parte D troca isso pelo Flyway
spring.jpa.hibernate.ddl-auto=update